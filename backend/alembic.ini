# Used only by the alembic CLI during development, e.g.:
#   uv run alembic revision --autogenerate -m "add ideas and places"
# At runtime the API runs migrations itself (app/migrate.py).
[alembic]
script_location = app/migrations
sqlalchemy.url = sqlite:///data/wander.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
