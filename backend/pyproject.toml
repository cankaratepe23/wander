[project]
name = "wander"
version = "0.1.0"
description = "A couple's travel-idea inbox: capture first, classify later."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "yt-dlp>=2026.10.21",
    "faster-whisper>=1.2.1",
    "curl-cffi>=0.16.3",
    "instaloader>=4.15.4",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Supply-chain hygiene: resolve only releases at least ~2 weeks old at lock time.
# Bump this date deliberately when updating dependencies.
exclude-newer = "2026-10-24T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long string literals are fine

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
